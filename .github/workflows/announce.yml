name: Announce

# Posts an Announcement to this repository's Discussions. The `data` repo's
# Release data workflow starts it, with a title and a body, when a release
# carries a new accuracy report. It has no schedule, so GitHub can never
# pause it.

on:
  workflow_dispatch:
    inputs:
      title:
        description: The post's title
        type: string
        required: true
      body:
        description: The post's text, in Markdown
        type: string
        required: true

permissions:
  contents: read
  discussions: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      # The inputs go in through the environment, never pasted into the script.
      - name: Post the Announcement
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          TITLE: ${{ inputs.title }}
          BODY: ${{ inputs.body }}
        run: |
          ids="$(gh api graphql -f owner="$OWNER" -f name="$REPO" -f query='query($owner: String!, $name: String!) { repository(owner: $owner, name: $name) { id discussionCategories(first: 25) { nodes { id name } } } }')"
          repository="$(jq -r '.data.repository.id' <<<"$ids")"
          category="$(jq -r '.data.repository.discussionCategories.nodes[] | select(.name == "Announcements") | .id' <<<"$ids")"
          if [[ -z "$category" ]]; then
            echo "::error::This repository has no Announcements category in its Discussions."
            exit 1
          fi
          url="$(gh api graphql -f repository="$repository" -f category="$category" -f title="$TITLE" -f body="$BODY" -f query='mutation($repository: ID!, $category: ID!, $title: String!, $body: String!) { createDiscussion(input: {repositoryId: $repository, categoryId: $category, title: $title, body: $body}) { discussion { url } } }' --jq '.data.createDiscussion.discussion.url')"
          echo "Posted $url" | tee -a "$GITHUB_STEP_SUMMARY"
